e/llm_counterfactual.py" = ["E501"], "tests/unit/test_counterfactual.py" = ["E501"], "tests/unit/test_counterfactual_eval.py" = ["E501"], "evals/metrics/counterfactuals.py" = ["E501"], "evals/runners/eval_counterfactuals.py" = ["E501"], "src/claimtower/agents/gap.py" = ["E501"], "src/claimtower/evidence/incremental.py" = ["E501"], "tests/unit/test_gap_agent.py" = ["E501"], "tests/unit/test_gap_agent_eval.py" = ["E501"], "evals/runners/eval_gap_agent.py" = ["E501"], "src/claimtower/orchestration/*.py" = ["E501"], "src/claimtower/composition.py" = ["E501"], "tests/unit/test_orchestration.py" = ["E501"], "tests/integration/test_graph_flow.py" = ["E501"], "scripts/run_graph.py" = ["E501"], "src/claimtower/api/*.py" = ["E501"], "src/claimtower/core/state_diff.py" = ["E501"], "tests/api/test_api.py" = ["E501"], "scripts/export_openapi.py" = ["E501"], "scripts/run_api.py" = ["E501"], "scripts/generate_sample_claim.py" = ["E501"], "tests/api/test_samples.py" = ["E501"], "src/claimtower/ui/*.py" = ["E501"], "src/claimtower/ui/components/*.py" = ["E501"], "src/claimtower/ingestion/preview.py" = ["E501"], "tests/ui/test_document_reader.py" = ["E501"], "tests/ui/test_gap_board.py" = ["E501"], "tests/ui/test_assessment.py" = ["E501"], "tests/unit/test_policy_manager.py" = ["E501"], "src/claimtower/policy/manager.py" = ["E501"], "src/claimtower/policy/llm_identity.py" = ["E501"], "src/claimtower/policy/llm_segments.py" = ["E501"], "src/claimtower/ingestion/classifier.py" = ["E501"], "src/claimtower/ingestion/provenance.py" = ["E501"], "src/claimtower/ingestion/extractors/llm.py" = ["E501"], "src/claimtower/ingestion/extractors/__init__.py" = ["E501"], "src/claimtower/policy/decompose.py" = ["E501"], "tests/unit/test_policy_segments_llm.py" = ["E501"], "tests/unit/test_mock_data.py" = ["E501"], "tests/unit/test_extract_all.py" = ["E501"], "tests/unit/test_forecast_gate.py" = ["E501"], "tests/api/test_with_documents.py" = ["E501"], "tests/unit/test_deductible_endorsement.py" = ["E5