[project]
name = "claimtower"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [  # pinned to latest as of 2026-11-24
  "pydantic==2.14.4", "pyyaml==6.0.4", "langgraph==1.2.24", "fastapi==0.165.0",
  "uvicorn==0.54.0", "streamlit==1.67.0", "pymupdf==2.1", "pdfplumber==0.11.11", "pillow==13.0.0", "python-docx==1.2.0", "python-dotenv==1.2.4",
  "sqlalchemy==2.1.9", "python-multipart==0.0.34","openai"
]
[project.optional-dependencies]
llm = ["openai==3.59.0"]
dev = ["httpx==0.28.1", "hypothesis==6.170.17", "pytest-cov==7.1.0", "pytest==9.2.0", "ruff==0.17.6", "mypy==2.4.1", "import-linter==2.17", "pre-commit==4.7.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
filterwarnings = ["ignore:.asyncio.iscoroutinefunction. is deprecated:DeprecationWarning"]   # third-party (langsmith) on py3.14
[tool.ruff]
line-length = 140
extend-exclude = ["data", "docs"]
[tool.ruff.lint]
select = ["E", "F", "W"]
