py" = ["E501"], "tests/unit/test_intake.py" = ["E501"], "tests/unit/test_actions.py" = ["E501"], "tests/unit/test_settlement_eval.py" = ["E501"], "evals/metrics/settlement_inputs.py" = ["E501"], "evals/runners/eval_settlement_inputs.py" = ["E501"], "evals/metrics/coverage.py" = ["E501"], "evals/runners/eval_coverage.py" = ["E501"]}   # re-exports; dense tooling scripts
[tool.importlinter]
root_package = "claimtower"
[[tool.importlinter.contracts]]
name = "settlement must not import LLM code"
type = "forbidden"
source_modules = ["claimtower.settlement"]
forbidden_modules = ["claimtower.core.llm", "claimtower.agents"]
