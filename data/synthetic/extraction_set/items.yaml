# Labelled text documents for the field/table extraction eval (T2.3). ALL SYNTHETIC. Block style and quoted strings on purpose
# (an unquoted comma inside a YAML {flow mapping} silently splits a value).
#   split:  dev (written with the extractor in mind, fine to tune on) | holdout (different formats, report these)
#   expected: {field: normalised value}   flagged: fields that MUST come out flagged low-confidence   absent: must NOT be extracted
#   missing_required: required fields the extractor must report as missing   table: expected table and self-check status
# The document type is given (set by a human in the eval) so extraction is measured on its own, not through the classifier.
items:
# ------------------------------------------------------------------------------------------------ dev
