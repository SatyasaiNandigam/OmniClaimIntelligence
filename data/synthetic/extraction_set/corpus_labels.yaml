    table:
      status: reconciled
      total: "150000"
      items: [["Bathroom repairs", "90000"], ["Corridor repairs", "60000"]]
  DOC-S05-1:
    doc_type: fnol
    expected:
      claimant_name: "SYNTHETIC Claimant E"
      policy_number: "POL-1005"
      loss_date: "2026-06-10"
      estimated_loss: "110000"
      loss_description: "On 10 June 2026 the pipe coupling in the utility room split suddenly and water spread to the adjoining passage."
