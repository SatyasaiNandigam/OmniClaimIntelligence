# SYNTHETIC. Labelled cases for the minimum-evidence request generator (T4.5).
# `dev` = used to write and tune the prompt: S-01 and S-05 are rebuilt from the scenario ground truth (their labelled requests are the main dev
# labels) plus three synthetic cases. `fresh` = written BEFORE any model result on it was seen, run once after the prompt was frozen.
# A case gives what T4.4 would hand over: for each open question not established, its `gap` (contradictory | missing | insufficient), one `verdicts`
# entry per establishing criterion (met | partly | unmet | unclear), and `abstained: true` where the classifier declined. `contradictions` name the
# conflicting facts. `received` are the document types already on file. `expect` is what a careful adjuster would ask:
#   addressee role -> the question ids that one request must resolve. No other addressee may be asked (an addressee not listed is a wrong request).
# Criteria order per question (see question_templates.yaml): Q-INFORCE [PAS status]; Q-SUDDEN [technical statement, began at loss date];
# Q-START [technical evidence of start, maintenance/inspection record]; Q-EXTENT [surveyor list, each area linked to event];
# Q-AMOUNT [surveyor-assessed cost, estimate reconciling to scope]; Q-SUBLIMIT [endorsement wording].

cases:
  # ---------------------------------------------------------------------------------------------------- dev
  - id: S-01
    split: dev
    received: [fnol, plumber_report, surveyor_report, estimate]
    facts:
      - {id: F-S01-02, text: "Claimant reports the kitchen supply pipe burst suddenly", tags: [Q-SUDDEN]}
      - {id: F-S01-03, text: "Significant corrosion was present at the joint of the kitchen supply pipe", tags: [Q-SUDDEN, Q-START]}
      - {id: F-S01-04, text: "Moisture was elevated in the kitchen, hallway and adjoining bedroom wall", tags: [Q-SUDDEN, Q-EXTENT]}
      - {id: F-S01-05, text: "Contractor estimate total is INR 180,000", tags: [Q-AMOUNT]}
      - {id: F-S01-06, text: "Estimate scope covers only the kitchen and hallway", tags: [Q-EXTENT, Q-AMOUNT]}
    contradictions:
      - {question: Q-SUDDEN, a: [F-S01-02], b: [F-S01-03, F-S01-04], explanation: "Claimant reports a sudden burst; plumber reports significant corrosion at the failed joint and the surveyor found moisture in several areas, both consistent with prolonged leakage."}
    questions:
      Q-SUDDEN: {gap: contradictory, verdicts: [met, met]}
      Q-START: {gap: missing, verdicts: [unmet, unmet]}
      Q-EXTENT: {gap: insufficient, verdicts: [met, unmet]}
      Q-AMOUNT: {gap: insufficient, verdicts: [unmet, partly]}
    expect:
      plumber: [Q-SUDDEN, Q-START]
      claimant: [Q-START]
      surveyor: [Q-EXTENT, Q-AMOUNT]
  - id: S-05
    split: dev
    received: [fnol, plumber_report, surveyor_report, estimate, policy_schedule]
    facts:
      - {id: F-S05-08, text: "Schedule references endorsement END-01", tags: [Q-SUBLIMIT]}
    questions:
      Q-SUBLIMIT: {gap: missing, verdicts: [unmet]}
    expect:
      policy_administration: [Q-SUBLIMIT]
  - id: D1-claimant-only
    split: dev
    received: [fnol]
    facts:
      - {id: f1, text: "Claimant reports: the pipe burst suddenly in the night", tags: [Q-SUDDEN]}
    questions:
      Q-SUDDEN: {gap: insufficient, verdicts: [unmet, met]}
    expect:
      plumber: [Q-SUDDEN]
  - id: D2-amount-conflict
    split: dev
    received: [fnol, surveyor_report, estimate]
    facts:
      - {id: f1, text: "Estimate total is INR 140,000", tags: [Q-AMOUNT]}
      - {id: f2, text: "Surveyor assessed the repair cost at INR 100,000", tags: [Q-AMOUNT]}
    contradictions:
      - {question: Q-AMOUNT, a: [f1], b: [f2], explanation: "The amounts differ by 29%: INR 140,000 against INR 100,000."}
    questions:
      Q-AMOUNT: {gap: contradictory, verdicts: [met, met]}
    expect:
      surveyor: [Q-AMOUNT]
  - id: D3-clean
    split: dev
    received: [fnol, plumber_report, surveyor_report, estimate]
    facts:
      - {id: f1, text: "Plumber reports: the fitting failed suddenly", tags: [Q-SUDDEN]}
    questions: {}
    expect: {}

  # ---------------------------------------------------------------------------------------------------- fresh (unseen)
  - id: N1-cause-conflict
    split: fresh
    received: [fnol, plumber_report]
    facts:
      - {id: f1, text: "Claimant reports: the pipe failed without any warning in the night", tags: [Q-SUDDEN]}
      - {id: f2, text: "Plumber reports: the pipe wall was heavily corroded and the joint had been seeping for a long time", tags: [Q-SUDDEN, Q-START]}
    contradictions:
      - {question: Q-SUDDEN, a: [f1], b: [f2], explanation: "The claimant says the pipe failed without warning; the plumber found long-term seepage and corrosion."}
    questions:
      Q-SUDDEN: {gap: contradictory, verdicts: [met, met]}
    expect:
      plumber: [Q-SUDDEN]
  - id: N2-amount-conflict
    split: fresh
    received: [fnol, estimate, surveyor_report]
    facts:
      - {id: f1, text: "Claimant estimates the loss at INR 250,000", tags: [Q-AMOUNT]}
      - {id: f2, text: "Surveyor assessed the repair cost at INR 120,000", tags: [Q-AMOUNT]}
    contradictions:
      - {question: Q-AMOUNT, a: [f1], b: [f2], explanation: "The amounts differ by 52%: INR 250,000 against INR 120,000."}
    questions:
      Q-AMOUNT: {gap: contradictory, verdicts: [met, met]}
    expect:
      surveyor: [Q-AMOUNT]
  - id: N3-nothing-on-start-or-extent
    split: fresh
    received: [fnol]
    facts:
      - {id: f1, text: "Claimant reports: the stopcock failed and flooded the cellar", tags: [Q-SUDDEN]}
    questions:
      Q-START: {gap: missing, verdicts: [unmet, unmet]}
      Q-EXTENT: {gap: missing, verdicts: [unmet, unmet]}
    expect:
      plumber: [Q-START]
      claimant: [Q-START]
      surveyor: [Q-EXTENT]
  - id: N4-endorsement-missing
    split: fresh
    received: [fnol, plumber_report, surveyor_report, estimate, policy_schedule]
    facts:
      - {id: f1, text: "The schedule lists endorsements: END-01, END-02", tags: [Q-SUBLIMIT]}
    questions:
      Q-SUBLIMIT: {gap: missing, verdicts: [unmet]}
    expect:
      policy_administration: [Q-SUBLIMIT]
  - id: N5-no-policy-answer
    split: fresh
    received: [fnol]
    facts:
      - {id: f1, text: "Reported date of loss is 12 April 2026", tags: [Q-INFORCE]}
    questions:
      Q-INFORCE: {gap: missing, verdicts: [unmet]}
    expect:
      policy_administration: [Q-INFORCE]
  - id: N6-plumber-report-already-on-file
    split: fresh
    received: [fnol, plumber_report]
    facts:
      - {id: f1, text: "Claimant reports: the hose burst suddenly", tags: [Q-SUDDEN]}
      - {id: f2, text: "Plumber reports: replaced the hose and tested the supply", tags: [Q-SUDDEN]}
    questions:
      Q-SUDDEN: {gap: insufficient, verdicts: [unmet, partly]}
    expect:
      plumber: [Q-SUDDEN]
  - id: N7-all-established
    split: fresh
    received: [fnol, plumber_report, surveyor_report, estimate]
    facts:
      - {id: f1, text: "Surveyor assessed the repair cost at INR 98,000", tags: [Q-AMOUNT]}
    questions: {}
    expect: {}
  - id: N8-classifier-abstained
    split: fresh
    received: [fnol, plumber_report]
    facts:
      - {id: f1, text: "Plumber reports: the failure may have been sudden", tags: [Q-SUDDEN]}
    questions:
      Q-SUDDEN: {abstained: true, verdicts: [unclear, met]}
    expect: {}
  - id: N9-extent-and-cost-short
    split: fresh
    received: [fnol, surveyor_report, estimate]
    facts:
      - {id: f1, text: "Surveyor reports: moisture was found in the utility room, the garage wall and the bedroom above", tags: [Q-EXTENT]}
      - {id: f2, text: "Estimate scope covers only the utility room", tags: [Q-EXTENT, Q-AMOUNT]}
      - {id: f3, text: "Estimate total is INR 61,000", tags: [Q-AMOUNT]}
    questions:
      Q-EXTENT: {gap: insufficient, verdicts: [met, unmet]}
      Q-AMOUNT: {gap: insufficient, verdicts: [unmet, partly]}
    expect:
      surveyor: [Q-EXTENT, Q-AMOUNT]
  - id: N10-cause-and-start
    split: fresh
    received: [fnol]
    facts:
      - {id: f1, text: "Claimant reports: the supply pipe split suddenly while we were cooking", tags: [Q-SUDDEN]}
    questions:
      Q-SUDDEN: {gap: insufficient, verdicts: [unmet, met]}
      Q-START: {gap: missing, verdicts: [unmet, unmet]}
    expect:
      plumber: [Q-SUDDEN, Q-START]
      claimant: [Q-START]

  # ---------------------------------------------------------------------------------------------------- fresh2 (unseen: written after the first fresh run showed
  # that the model's items were refused for length, and BEFORE the repair round was run on anything; run once)
  - id: M1-cause-conflict-and-cost
    split: fresh2
    received: [fnol, plumber_report, estimate]
    facts:
      - {id: f1, text: "Claimant reports: the washing machine hose burst suddenly while the machine was running", tags: [Q-SUDDEN]}
      - {id: f2, text: "Plumber reports: the hose was perished and cracked along its length, consistent with long-term wear", tags: [Q-SUDDEN, Q-START]}
      - {id: f3, text: "Estimate total is INR 88,000", tags: [Q-AMOUNT]}
    contradictions:
      - {question: Q-SUDDEN, a: [f1], b: [f2], explanation: "The claimant says the hose burst suddenly; the plumber found it perished and cracked from long-term wear."}
    questions:
      Q-SUDDEN: {gap: contradictory, verdicts: [met, met]}
      Q-AMOUNT: {gap: insufficient, verdicts: [unmet, partly]}
    expect:
      plumber: [Q-SUDDEN]
      surveyor: [Q-AMOUNT]
  - id: M2-start-date-missing
    split: fresh2
    received: [fnol, plumber_report]
    facts:
      - {id: f1, text: "Plumber reports: replaced the cracked elbow joint under the bathroom basin", tags: [Q-SUDDEN, Q-START]}
    questions:
      Q-START: {gap: missing, verdicts: [unmet, unmet]}
    expect:
      plumber: [Q-START]
      claimant: [Q-START]
  - id: M3-extent-conflict-and-no-policy-answer
    split: fresh2
    received: [fnol, surveyor_report]
    facts:
      - {id: f1, text: "Claimant reports: only the bathroom ceiling was damaged", tags: [Q-EXTENT]}
      - {id: f2, text: "Surveyor reports: damp was found in the bathroom ceiling, the landing and two bedroom walls", tags: [Q-EXTENT]}
    contradictions:
      - {question: Q-EXTENT, a: [f1], b: [f2], explanation: "The claimant reports damage to the bathroom ceiling only; the surveyor found damp in the landing and two bedroom walls as well."}
    questions:
      Q-EXTENT: {gap: contradictory, verdicts: [met, met]}
      Q-INFORCE: {gap: missing, verdicts: [unmet]}
    expect:
      surveyor: [Q-EXTENT]
      policy_administration: [Q-INFORCE]
  - id: M4-endorsement-and-cause
    split: fresh2
    received: [fnol, policy_schedule]
    facts:
      - {id: f1, text: "Claimant reports: the tank overflowed after the float valve stuck", tags: [Q-SUDDEN]}
      - {id: f2, text: "The schedule lists endorsements: END-03", tags: [Q-SUBLIMIT]}
    questions:
      Q-SUBLIMIT: {gap: missing, verdicts: [unmet]}
      Q-SUDDEN: {gap: insufficient, verdicts: [unmet, met]}
    expect:
      policy_administration: [Q-SUBLIMIT]
      plumber: [Q-SUDDEN]
  - id: M5-cost-conflict-and-extent-short
    split: fresh2
    received: [fnol, estimate, invoice, surveyor_report]
    facts:
      - {id: f1, text: "Invoice total is INR 150,000", tags: [Q-AMOUNT]}
      - {id: f2, text: "Estimate total is INR 100,000", tags: [Q-AMOUNT]}
      - {id: f3, text: "Surveyor reports: water reached the lounge and dining room floors", tags: [Q-EXTENT]}
    contradictions:
      - {question: Q-AMOUNT, a: [f1], b: [f2], explanation: "The invoice total is 50% above the estimate total: INR 150,000 against INR 100,000."}
    questions:
      Q-AMOUNT: {gap: contradictory, verdicts: [met, met]}
      Q-EXTENT: {gap: insufficient, verdicts: [met, unmet]}
    expect:
      surveyor: [Q-AMOUNT, Q-EXTENT]
  - id: M6-start-with-reports-on-file
    split: fresh2
    received: [fnol, plumber_report, surveyor_report, photo]
    facts:
      - {id: f1, text: "Surveyor reports: staining on the ceiling below the bathroom", tags: [Q-EXTENT, Q-START]}
    questions:
      Q-START: {gap: missing, verdicts: [unmet, unmet]}
    expect:
      plumber: [Q-START]
      claimant: [Q-START]
  - id: M7-nothing-open
    split: fresh2
    received: [fnol, plumber_report, surveyor_report, estimate]
    facts:
      - {id: f1, text: "Surveyor assessed the repair cost at INR 73,000", tags: [Q-AMOUNT]}
    questions: {}
    expect: {}
