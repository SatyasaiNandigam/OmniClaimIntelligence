     exclusion: ambiguous}
  - {id: H-3, split: fresh, policy: BASE-HOME-2, facts: ["The pipe under the basin sheared off during the night and the bathroom flooded within minutes."], exclusion: supports}
  - {id: H-4, split: fresh, policy: BASE-HOME-2, facts: ["The invoice for a replacement radiator is dated 21 February 2026."], exclusion: unclear}
  - {id: H-5, split: fresh, facts: ["The plumber states the stopcock seized and the supply hose burst suddenly, flooding the utility room within minutes."], cover: supports, exclusion: supports}
  - {id: H-6, split: fresh, facts: ["The surveyor found corroded joints and staining showing the pipe had been leaking slowly for over a year."], cover: against, exclusion: against}
  - {id: H-7, split: fresh, policy: BASE-HOME-3, facts: ["The plumber states a joint in the loft tank feed pipe failed suddenly and water ran into the bedroom within minutes."], exclusion: supports}
  - {id: H-8, split: fresh, facts: ["The claimant says there was water on the floor when they got home.", "The cause has not been investigated."], cover: unclear, exclusion: unclear}
