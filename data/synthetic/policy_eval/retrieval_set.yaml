  - {id: R-29, split: fresh, kind: lexical, snapshot: RIVR, query: "Is a burst hose covered?", relevant: ["RIVERSIDE-1:Clause 2.1 Water escape"]}
  - {id: R-30, split: fresh, kind: lexical, snapshot: RIVR, query: "Are unoccupied homes excluded?", relevant: ["RIVERSIDE-1:Clause 3.2 Unoccupied homes"]}
  - {id: R-31, split: fresh, kind: paraphrase, snapshot: RIVR, query: "How long do I have to tell the insurer about a loss?", relevant: ["RIVERSIDE-1:Clause 5.1 Prompt notice"]}
  - {id: R-32, split: fresh, kind: lexical, snapshot: RIVR, query: "What does burst mean?", relevant: ["RIVERSIDE-1:Clause 1.2 Burst"]}
