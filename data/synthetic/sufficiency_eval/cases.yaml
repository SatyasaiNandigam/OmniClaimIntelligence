# SYNTHETIC. Labelled cases for the sufficiency classifier (T4.4).
# `dev` = used to write and tune the prompt (together with the five scenario ground-truth files S-01..S-05, whose question statuses and gap
# types are the main dev labels). `fresh` = written BEFORE any model result on it was seen, run once after the prompt was frozen.
# Each fact has `tags` (the questions the fact templates tag it with) and `dir` (its direction relative to the claim as presented:
# supporting | contradicting | neutral, as the linker T4.2 would give it). `contradictions` are given as input (T4.3 output): question, severity,
# fact ids. `policy`: in_force (default, with sublimit wording) | no_sublimit (endorsement referenced but missing) | not_in_force | none (no PAS answer).
# `expect` is scored only for the questions listed: {status, gap}; gap is one of missing / contradictory / insufficient / none.
# Statuses follow the labelled data: established | partially_established | possible | unverified | requires_validation | missing.

cases:
  # ---------------------------------------------------------------------------------------------------- dev
  - id: D1-claimant-only-cause
    split: dev
    facts:
      - {id: f1, text: "Claimant reports: the pipe burst suddenly in the night", tags: [Q-SUDDEN], dir: supporting}
    expect:
      Q-SUDDEN: {status: possible, gap: insufficient}
  - id: D2-estimate-only
    split: dev
    facts:
      - {id: f1, text: "Estimate total is INR 90,000", tags: [Q-AMOUNT], dir: neutral}
      - {id: f2, text: "Estimate line 'Pipe replacement' is INR 30,000", tags: [Q-AMOUNT], dir: neutral}
    expect:
      Q-AMOUNT: {status: unverified, gap: insufficient}
  - id: D3-no-extent-evidence
    split: dev
    facts:
      - {id: f1, text: "Claimant estimates the loss at INR 70,000", tags: [Q-AMOUNT], dir: neutral}
    expect:
      Q-EXTENT: {status: missing, gap: missing}
  - id: D4-cause-contradicted
    split: dev
    facts:
      - {id: f1, text: "Claimant reports: the pipe burst suddenly", tags: [Q-SUDDEN], dir: supporting}
      - {id: f2, text: "Plumber reports: the pipe wall had been thinned by long-term corrosion", tags: [Q-SUDDEN, Q-START], dir: contradicting}
    contradictions:
      - {question: Q-SUDDEN, severity: high, a: [f1], b: [f2]}
    expect:
      Q-SUDDEN: {status: requires_validation, gap: contradictory}

  # ---------------------------------------------------------------------------------------------------- fresh (unseen)
  - id: N1-complete-and-clean
    split: fresh
    facts:
      - {id: f1, text: "Claimant reports: the supply pipe split suddenly while we were cooking", tags: [Q-SUDDEN], dir: supporting}
      - {id: f2, text: "Plumber reports: the fitting failed suddenly; a fresh fracture surface and no earlier leakage or corrosion were found", tags: [Q-SUDDEN, Q-START], dir: supporting}
      - {id: f3, text: "Maintenance record dated 10 January 2026 shows the pipework was inspected and found sound", tags: [Q-START], dir: supporting}
      - {id: f4, text: "Surveyor reports: moisture is confined to the kitchen floor and the lower wall; all of it is consistent with the reported burst", tags: [Q-SUDDEN, Q-EXTENT], dir: supporting}
      - {id: f5, text: "Surveyor assessed the repair cost at INR 98,000", tags: [Q-AMOUNT], dir: neutral}
      - {id: f6, text: "Estimate total reconciles to the surveyor assessment", tags: [Q-AMOUNT], dir: neutral}
    expect:
      Q-SUDDEN: {status: established, gap: none}
      Q-START: {status: established, gap: none}
      Q-EXTENT: {status: established, gap: none}
      Q-AMOUNT: {status: established, gap: none}
  - id: N2-claimant-only
    split: fresh
    facts:
      - {id: f1, text: "Claimant reports: the hose came off its fitting with a bang and water went everywhere", tags: [Q-SUDDEN], dir: supporting}
    expect:
      Q-SUDDEN: {status: possible, gap: insufficient}
  - id: N3-cause-contradicted
    split: fresh
    facts:
      - {id: f1, text: "Claimant reports: the pipe failed without any warning in the night", tags: [Q-SUDDEN], dir: supporting}
      - {id: f2, text: "Plumber reports: the pipe wall was heavily corroded and the joint had been seeping for a long time", tags: [Q-SUDDEN, Q-START], dir: contradicting}
    contradictions:
      - {question: Q-SUDDEN, severity: high, a: [f1], b: [f2]}
    expect:
      Q-SUDDEN: {status: requires_validation, gap: contradictory}
  - id: N4-estimate-without-assessment
    split: fresh
    facts:
      - {id: f1, text: "Estimate total is INR 112,000", tags: [Q-AMOUNT], dir: neutral}
      - {id: f2, text: "Estimate line 'Replace kitchen floor' is INR 70,000", tags: [Q-AMOUNT], dir: neutral}
      - {id: f3, text: "Estimate line 'Redecoration' is INR 42,000", tags: [Q-AMOUNT], dir: neutral}
    expect:
      Q-AMOUNT: {status: unverified, gap: insufficient}
  - id: N5-amount-contradicted
    split: fresh
    facts:
      - {id: f1, text: "Estimate total is INR 140,000", tags: [Q-AMOUNT], dir: neutral}
      - {id: f2, text: "Surveyor assessed the repair cost at INR 100,000", tags: [Q-AMOUNT], dir: neutral}
    contradictions:
      - {question: Q-AMOUNT, severity: medium, a: [f1], b: [f2]}
    expect:
      Q-AMOUNT: {status: requires_validation, gap: contradictory}
  - id: N6-extent-partly-scoped
    split: fresh
    facts:
      - {id: f1, text: "Surveyor reports: moisture was found in the utility room, the garage wall and the bedroom above", tags: [Q-EXTENT], dir: contradicting}
      - {id: f2, text: "Estimate scope covers only the utility room", tags: [Q-EXTENT, Q-AMOUNT], dir: neutral}
    expect:
      Q-EXTENT: {status: partially_established, gap: insufficient}
  - id: N7-no-extent-evidence
    split: fresh
    facts:
      - {id: f1, text: "Estimate total is INR 56,000", tags: [Q-AMOUNT], dir: neutral}
      - {id: f2, text: "Claimant reports: the stopcock failed and flooded the cellar", tags: [Q-SUDDEN], dir: supporting}
    expect:
      Q-EXTENT: {status: missing, gap: missing}
  - id: N8-start-nothing-relevant
    split: fresh
    facts:
      - {id: f1, text: "Plumber reports: replaced the joint and tested the supply", tags: [Q-START], dir: neutral}
      - {id: f2, text: "Claimant reports: the pipe burst suddenly", tags: [Q-SUDDEN], dir: supporting}
    expect:
      Q-START: {status: missing, gap: missing}
  - id: N9-low-contradiction-does-not-block
    split: fresh
    facts:
      - {id: f1, text: "Surveyor assessed the repair cost at INR 98,000", tags: [Q-AMOUNT], dir: neutral}
      - {id: f2, text: "Estimate total reconciles to the surveyor assessment", tags: [Q-AMOUNT], dir: neutral}
      - {id: f3, text: "Claimant estimates the loss at INR 108,000", tags: [Q-AMOUNT], dir: neutral}
    contradictions:
      - {question: Q-AMOUNT, severity: low, a: [f3], b: [f1]}
    expect:
      Q-AMOUNT: {status: established, gap: none}
  - id: N10-lapsed-policy
    split: fresh
    policy: not_in_force
    facts:
      - {id: f1, text: "Reported date of loss is 12 April 2026", tags: [Q-INFORCE], dir: neutral}
    expect:
      Q-INFORCE: {status: established, gap: none}
  - id: N11-no-policy-answer
    split: fresh
    policy: none
    facts:
      - {id: f1, text: "Reported date of loss is 12 April 2026", tags: [Q-INFORCE], dir: neutral}
    expect:
      Q-INFORCE: {status: missing, gap: missing}
  - id: N12-endorsement-wording-missing
    split: fresh
    policy: no_sublimit
    facts:
      - {id: f1, text: "The schedule lists endorsements: END-01", tags: [Q-SUBLIMIT], dir: neutral}
    expect:
      Q-SUBLIMIT: {status: missing, gap: missing}
