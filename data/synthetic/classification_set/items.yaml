# Labelled documents for the document-type classifier eval (T2.2). ALL SYNTHETIC.
#
# expected: a pack type, or `unknown` = the classifier MUST abstain and route to a human.
# split:
#   dev      written alongside the signals; fine to tune on
#   holdout  written in different words than the signals; report these, do not tune on them blindly
# (A further `fresh` split is added only AFTER tuning so there is an unseen check; see evals/baselines/classification.json.)
# kind: text -> a plain .txt file with `text`;  email -> an .eml built from `headers` + `body`.
