# SYNTHETIC scenarios S-01..S-05 (BUILD_PLAN section 12). Ground truth: data/ground_truth/<id>.json
schema_version: 1
synthetic: true
note: ALL DATA IS SYNTHETIC. Document page text is the source for scripts/generate_synthetic_docs.py (T1.3) and for the verbatim
  evidence_text check on ground-truth facts. All money values are SAMPLE.
clause_catalogue:
- clause_id: CL-DEF-SUDDEN
  clause_type: definition
  document: base_wording
  purpose: Defines 'sudden and accidental' (abrupt, unforeseen, not gradual).
- clause_id: CL-COV-WATER
  clause_type: coverage
  document: base_wording
  purpose: Covers escape of water from fixed pipes/tanks, provided it is sudden and accidental.
- clause_id: CL-EXC-GRADUAL
  clause_type: exclusion
  document: base_wording
  purpose: Excludes gradual leakage, seepage, corrosion and deterioration over time.
- clause_id: CL-COND-PERIOD
  clause_type: condition
  document: base_wording
  purpose: Cover applies only for loss occurring within the period of insurance.
- clause_id: CL-LIM-BUILDING
  clause_type: limit
  document: base_wording
  purpose: Building sum insured / limit of liability (SAMPLE INR 2,000,000).
- clause_id: CL-DED-STD
  clause_type: deductible
  document: base_wording
  purpose: Standard deductible per claim (SAMPLE INR 10,000).
- clause_id: CL-SUB-WATER-E1
  clause_type: sublimit
  document: END-01
  purpose: Water-damage sublimit (SAMPLE INR 100,000). Modifies CL-COV-WATER.
- clause_id: CL-SUB-WATER-E2
  clause_type: sublimit
  document: END-02
  purpose: Raises water-damage sublimit (SAMPLE INR 200,000) effective 2026-02-01. Modifies CL-SUB-WATER-E1.
scenarios:
- id: S-01
  title: 'Running example: sudden burst claimed, corrosion and multi-area moisture found'
  tests:
  - contradiction
  - missing start date
  - insufficient extent
  - sublimit endorsement
  - counterfactuals
