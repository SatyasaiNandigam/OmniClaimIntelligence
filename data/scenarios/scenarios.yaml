    claimant_name: SYNTHETIC Claimant A
    policy_ref: POL-1001
    loss_date: '2026-03-14'
    loss_type: water_damage
    loss_description: Kitchen supply pipe burst suddenly
    channel: portal
  pas_expectation:
    policy: POL-1001
    status: in_force
    period:
    - '2026-01-01'
    - '2026-12-31'
    endorsements:
    - END-01
  documents:
